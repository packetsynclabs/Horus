# Enable serial output for GRUB so we can see errors
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial

set timeout=0
set default=0

# For 64-bit Horus (Multiboot2 + long mode trampoline)
menuentry "Horus 64-bit Secure Microkernel" {
    insmod multiboot2
    set root=(cd)

    # Try the two most common locations
    if multiboot2 /boot/kernel.elf; then
        boot
    else
        if multiboot2 /kernel.elf; then
            boot
        fi
    fi
}
